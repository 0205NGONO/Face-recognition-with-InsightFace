<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Système de surveillance - Connexion</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="corps-connexion">

<main class="page">

  <header class="header">
    <img src="logo_inch.jpg" alt="" class="logo-icon">
    <div class="header-text">
      <h1>Système de surveillance</h1>
    </div>
  </header>

  <section class="card">
    <div class="card-body">
      <h2 class="card-title">Connexion</h2>

      <input type="radio" name="tab" id="tabAdmin" class="tab-radio" checked>
      <input type="radio" name="tab" id="tabEmploye" class="tab-radio">

      <div class="tabs">
        <label for="tabAdmin" class="tab">Administrateur</label>
        <label for="tabEmploye" class="tab">Employé</label>
      </div>

      <!-- Formulaire Administrateur : email + mot de passe -->
      <form id="formAdmin" class="role-form" action="{{ url_for('login_admin') }}" method="post">
        <div class="field">
          <label for="nomAdmin">Nom</label>
          <input type="text" id="nomAdmin" name="nom" placeholder="Nom de l'administrateur" required>
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="••••••••••" required>
        </div>

        <button type="submit" class="btn-submit">Se connecter</button>

        {% if erreur_admin %}
        <p class="error-msg">{{ erreur_admin }}</p>
        {% endif %}
      </form>

      <!-- Formulaire Employé : nom complet seul -->
      <form id="formEmploye" class="role-form" action="{{ url_for('login_employe') }}" method="post">
        <div class="field">
          <label for="name">Nom complet</label>
          <input type="text" id="name" name="name" placeholder="Entrez votre nom" required>
        </div>

        <button type="submit" class="btn-submit">Se connecter</button>

        {% if erreur_employe %}
        <p class="error-msg">{{ erreur_employe }}</p>
        {% endif %}
      </form>
    </div>

    <footer class="footer">
      <p>Accès sécurisé au système de surveillance</p>
    </footer>
  </section>

</main>

</body>
</html>
